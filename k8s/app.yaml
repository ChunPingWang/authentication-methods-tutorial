# 部署本教學應用程式，並把 OIDC 信任的發行者指向叢集內的 Keycloak。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-tutorial-app
  namespace: auth-tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-tutorial-app
  template:
    metadata:
      labels:
        app: auth-tutorial-app
    spec:
      containers:
        - name: app
          # 先 `docker build -t auth-tutorial:1.0.0 .` 並推送到你的 registry
          image: auth-tutorial:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # 指向叢集內 Keycloak 的 tutorial realm
            - name: OIDC_TRUSTED-ISSUER
              value: "http://keycloak.auth-tutorial.svc.cluster.local:8080/realms/tutorial"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-tutorial-app
  namespace: auth-tutorial
spec:
  type: NodePort
  selector:
    app: auth-tutorial-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
