# 在 Kubernetes 中部署 OpenLDAP 作為「企業目錄」。
#
# 用途：
#   1. 作為 Keycloak 的 User Federation 後端（在 Keycloak realm 設定 LDAP provider）。
#   2. 也可作為本教學 SSO 的身分來源（自行實作 LdapIdentityProviderAdapter）。
#
# 注意：此為教學用最小設定，未持久化（重啟即清空），請勿用於正式環境。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: auth-tutorial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          env:
            - name: LDAP_ORGANISATION
              value: "Tutorial Inc"
            - name: LDAP_DOMAIN
              value: "tutorial.local"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin"
          ports:
            - containerPort: 389
              name: ldap
            - containerPort: 636
              name: ldaps
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: auth-tutorial
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: 389
    - name: ldaps
      port: 636
      targetPort: 636
